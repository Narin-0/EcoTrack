<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EcoTrack - Выбор роли</title>
    <link rel="icon" href="/Изабражения/Книга_и_перо.png" type="image/png">
    <link rel="stylesheet" href="/CSS/base.css" />
    <link rel="stylesheet" href="/CSS/layout.css" />
    <link rel="stylesheet" href="/CSS/components.css" />
    <style>
        
        .role-selection {
            text-align: center;
            padding: 50px;
            margin-top: 50px;
            background-color: #fff;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            max-width: 600px;
            margin: 50px auto;
        }
        .role-selection a {
            display: inline-block;
            margin: 15px;
            padding: 15px 30px;
            background-color: #56AB2F; /* Зеленый цвет для кнопок выбора роли */
            color: white;
            border-radius: 8px;
            font-size: 1.2em;
            transition: background-color 0.3s ease;
        }
        .role-selection a:hover {
            background-color: #A8E063;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <header>
        <div class="logo">EcoTrack</div>
        <nav>
            <a href="/about">О проекте</a>
            <a href="/author">Автор проекта</a>
        </nav>
    </header>
    <main>
        <div class="role-selection">
            <h2>Добро пожаловать в EcoTrack!</h2>
            <p>Выберите свою роль:</p>
            <a href="/admin">Администратор</a>
            <a href="/user">Пользователь</a>
        </div>
    </main>
</body>
</html>
